services:
  db:
    image: mysql:8.0
    container_name: sqli_lab_mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sqli_lab
      MYSQL_USER: sqli
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    # Not published to the host — only the web container needs the database.
    volumes:
      - sqli_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: sqli_detection_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DATABASE_URL: "mysql+pymysql://sqli:${MYSQL_PASSWORD}@db:3306/sqli_lab"
      ML_MODEL_PATH: "/app/app/models/sql_injection_rf.joblib"
      RISK_BLOCK_THRESHOLD: 70
      # Off unless explicitly opted into: with this "true", anyone who clones
      # and runs the project gets a live, injectable login endpoint.
      ENABLE_VULNERABLE_DEMO: ${ENABLE_VULNERABLE_DEMO:-false}
      GLOBAL_WAF_BLOCKING: "false"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqli_mysql_data:
